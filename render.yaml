services:
  - type: web
    name: tourist-web
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Packages, destinations, and bookings must be stored in Postgres.
      # The local SQLite file is only used when running the project locally.
      - key: DATABASE_URL
        fromDatabase:
          name: tourist-web-db
          property: connectionString
    # Apply the Booking migrations before serving requests.  Without this,
    # a newly deployed database can be missing the booking columns and a
    # booking submission fails with HTTP 500.
    startCommand: python manage.py migrate --noinput && gunicorn tourism.wsgi:application

databases:
  - name: tourist-web-db
    databaseName: tourist_web
    user: tourist_web
