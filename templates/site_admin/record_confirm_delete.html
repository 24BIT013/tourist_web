{% extends 'tour_app/base.html' %}

{% block title %}Delete {{ config.singular }} | Website Management{% endblock %}
{% block body_class %}dashboard-page{% endblock %}

{% block content %}
<section class="section dashboard-form-section"><div class="container delete-panel"><span class="eyebrow">Website management</span><h1>Delete this {{ config.singular }}?</h1><p>{{ record }}</p><form method="post" class="delete-form">{% csrf_token %}<button class="btn btn-danger" type="submit">Delete {{ config.singular }}</button><a class="btn btn-secondary" href="{% url 'site_admin:dashboard' %}">Cancel</a></form></div></section>
{% endblock %}
